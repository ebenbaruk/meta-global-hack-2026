<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
  .cap { position: absolute; left: 190px; top: 50%; transform: translateY(-50%); width: 700px; }
  .num { font-size: 20px; color: var(--muted); }
  h2 { margin-top: 26px; font-size: 92px; }
  .tag { margin-top: 40px; }
  .tag .sticker { font-size: 22px; padding: 10px 20px; transform: rotate(-3deg); display: inline-flex; }
</style></head><body class="transparent">
  <div class="cap"><div class="num typed" id="num"></div><h2 class="display" id="title"></h2><div class="tag"><span class="sticker pop" id="tag"></span></div></div>
  <script>
    const q = new URLSearchParams(location.search);
    document.getElementById("num").textContent = q.get("num") || "";
    document.getElementById("title").textContent = q.get("title") || "";
    const tag = document.getElementById("tag");
    const t = q.get("tag") || "";
    tag.textContent = t;
    tag.className = "sticker pop " + (/image/i.test(t) ? "rose" : /sam/i.test(t) ? "mint" : /spark/i.test(t) ? "lilac" : "yellow");
    if (!t) tag.remove();
  </script>
</body></html>
